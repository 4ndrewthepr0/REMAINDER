[package]
name = "remainder"
version = "0.2.0"
edition = "2021"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
anyhow = "1.0"
bytemuck = { version = "1.16", features = ["derive"] }
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1.0"
notify = "6.1.1"
sha2 = "0.10"
hex = "0.4"
walkdir = "2.5"
