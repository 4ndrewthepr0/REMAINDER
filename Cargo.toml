[package]
name = "remainder"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-only"
description = "The Industrial Memory Bunker for AI Agents. Local-first, zero Python dependencies, sub-second retrieval, native MCP support."
repository = "https://github.com/4ndrewthepr0/REMAINDER"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
anyhow = "1.0"
bytemuck = { version = "1.16", features = ["derive"] }
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1.0"
notify = "6.1.1"
sha2 = "0.10"
hex = "0.4"
walkdir = "2.5"
tract-onnx = "0.23.9"
tokenizers = "0.23.2"
